name: ios12-arm64

on:
  workflow_dispatch:
  push:
    branches: [main, ios12-port]

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon runner; macos-15 ships Xcode 16.4 by default, which still
    # accepts a 12.0 deployment target. (macos-14 was retired on 2026-11-02.)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        run: brew install scons ldid dpkg

      - name: Cache OpenSSL/curl builds
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-openssl-1.1.1w-curl-7.77.0

      - name: Build arm64 .deb
        run: |
          chmod +x scripts/build-ios12.sh
          ./scripts/build-ios12.sh

      - name: Build Cydia repository
        run: python3 scripts/make_repo.py --output repo xcbuild/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: veteris-ios12-arm64
          path: |
            xcbuild/*.deb
            xcbuild/Veteris.app
          if-no-files-found: error

      - name: Publish Cydia repository to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
